name: Windows storage and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '${{ matrix.node }}'
          cache: npm
      - run: npm ci
      - run: npm test
      # The package smoke test packs through prepack, which builds the library.
      - run: npm run test:package
