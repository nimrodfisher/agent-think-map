<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>agent-think-map drop-in</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/nimrodfisher/agent-think-map@main/dist/styles.css"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      agent-think-map {
        display: block;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Point events-url at your agent's SSE. npx agent-think-map uses /sse. -->
    <agent-think-map events-url="/sse" layout="overlay"></agent-think-map>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/gh/nimrodfisher/agent-think-map@main/dist/element.cdn.js"
    ></script>
  </body>
</html>
